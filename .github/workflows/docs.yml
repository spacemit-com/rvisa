name: Docs

# Build the MkDocs site from the repository's primary documents and publish
# it to GitHub Pages. tools/docs.sh assembles docs/ from the repository tree;
# the site configuration is mkdocs.yml at the root.
#
# Publishing requires GitHub Pages to be enabled with the "GitHub Actions"
# source in the repository settings (Settings > Pages).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Assemble docs tree
        run: tools/docs.sh
      - name: Build site
        run: mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
