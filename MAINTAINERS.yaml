# RVISA maintenance areas and contributor assignments.
# Empty rosters indicate that appointments have not yet been recorded.
format_version: 1
status: unassigned
organizations: []
people: []
areas:
  - id: project
    paths:
      - README.md
      - README_CN.md
      - VERSION
      - CHANGELOG.md
      - CONTRIBUTING.md
      - MAINTAINERS.yaml
      - CODE_OF_CONDUCT.md
      - AGENTS.md
      - LICENSE
      - rfcs/**
