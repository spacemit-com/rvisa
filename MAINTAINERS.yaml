  - id: mlir
    paths:
      - mlir/**
    maintainers: []
  - id: python-frontend
    paths:
      - frontends/README.md
      - frontends/python/**
    maintainers: []
  - id: cpp-frontend
    paths:
      - frontends/README.md
      - frontends/cpp/**
    maintainers: []
  - id: target-mappings
    paths:
      - mappings/**
    maintainers: []
  - id: demos
    paths:
      - demos/**
    maintainers: []
  - id: conformance
    paths:
      - conformance/**
    maintainers: []
  - id: maintenance-tools
    paths:
      - schemas/**
      - tools/**
      - tests/**
      - .editorconfig
      - .gitignore
