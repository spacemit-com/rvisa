# Reference workload record (RVISA notation only). Field encodings follow
# schemas/README.md; the detailed schema is under development, so this is an
# authoring record rather than a validated backend interface.

id: gemm-epilogue
title: GEMM with Epilogue
workload: "P[m,n] = C[m,n] + sum_k A[m,k] * B[n,k]; Y[m,n] = max(P[m,n] + bias[n], 0)"
spec_version: "0.2.0"
status: notation
source_forms:
  rvisa: demos/gemm-epilogue/gemm-epilogue.rvisa
  host_forms: []

virtual_operations:
  - {id: RVISA-OP-TVIEW, role: "descriptors for A, B, bias, and Y"}
  - {id: RVISA-OP-TLOAD, role: "loads A, B, and the bias row"}
  - {id: RVISA-OP-TMMA, role: "rank-2 contraction with an explicit zero accumulator"}
  - {id: tadd / tbroadcast, role: "bias addition over the broadcast axis"}
  - {id: tmax / tzero, role: "ReLU epilogue"}
  - {id: RVISA-OP-TSTORE, role: "stores the f32 result tile"}

profiles:
  required: []
  note: no profile is required; the source form states no target sequence, register group, or transfer policy

element_types: {a: f16, b: f16, bias: f32, accumulator: f32, result: f32}
geometry: {M: 16, N: 16, K: 16, bias: [1, N]}
layouts: {a: ALayout.rowmajor, b: BLayout.colmajor, c: CLayout.rowmajor}
epilogue: bias then ReLU; one bias contribution per output element
numerical_policy: >
  Stated only where the notation must name it: f16 inputs, f32 accumulation and epilogue, ordered reduction. No approximation policy is selected for the activation.

verification:
  status: structural-only
  performed:
    - {layer: documentation, method: "operation names, operand roles, and defaults checked against spec/operations/", result: consistent}
    - {layer: documentation, method: "relative links and anchors in this workload README", result: resolve}
  not_performed:
    - frontend parsing or IR construction (no frontend exists in this revision)
    - compilation, instruction or register inspection
    - numerical evaluation, simulator or hardware execution
    - performance measurement

not_covered:
  - activations other than ReLU, fused versus decomposed epilogue realizations
  - partial output tiles, numerical extremes, and conversion rounding between accumulator and output formats
  - the multi-argument broadcast notation is provisional in the tile vocabulary

run: none
