# Reference workload record (RVISA notation only). Field encodings follow
# schemas/README.md; the detailed schema is under development, so this is an
# authoring record rather than a validated backend interface.

id: conv2d
title: Convolution
workload: "y[m,n] = sum_{r,s,c} x[b, p*SH + r*DH - PT, q*SW + s*DW - PL, c] * w[n, r*S*C + s*C + c]"
spec_version: "0.2.0"
status: notation
source_forms:
  rvisa: demos/conv2d/conv2d.rvisa
  host_forms: []

virtual_operations:
  - {id: RVISA-OP-TVIEW, role: "NHWC image descriptor, filter descriptor, output descriptor"}
  - {id: RVISA-OP-IM2COL, role: "unfolds one 16x16 tile of the image into the matrix input"}
  - {id: RVISA-OP-TLOAD, role: "loads the filter tile"}
  - {id: RVISA-OP-TMMA, role: "rank-2 contraction with an explicit zero accumulator"}
  - {id: RVISA-OP-TSTORE, role: "stores the output tile at [m0, n0]"}

profiles:
  required: []
  note: no profile is required; the source form states no target sequence, register group, or transfer policy

element_types: {image: f16, filter: f16, accumulator: f32, result: f32}
geometry: {tile: [16, 16], kernel: [R, S], stride: [SH, SW], dilation: [DH, DW], padding: [PT, PB, PL, PR]}
image_batch: folded into M (RVISA-IM2COL-*), never a matrix batch to reduce
layouts: {a: ALayout.rowmajor, b: BLayout.colmajor, c: CLayout.rowmajor}

verification:
  status: structural-only
  performed:
    - {layer: documentation, method: "operation names, operand roles, and defaults checked against spec/operations/", result: consistent}
    - {layer: documentation, method: "relative links and anchors in this workload README", result: resolve}
  not_performed:
    - frontend parsing or IR construction (no frontend exists in this revision)
    - compilation, instruction or register inspection
    - numerical evaluation, simulator or hardware execution
    - performance measurement

not_covered:
  - grouped/depthwise convolution and filter reversal variants
  - asymmetric padding, nonunit stride/dilation, empty output regions, and matrix tails
  - materialized versus accelerated im2col paths

run: none
